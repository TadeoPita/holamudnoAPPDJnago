{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cuentas de Instagram</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="mb-4">Cuentas de Instagram Conectadas</h1>

    {% if cuentas %}
        <table class="table table-hover table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Nombre de la Página</th>
                    <th>ID de Instagram</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for cuenta in cuentas %}
                    <tr>
                        <td>{{ cuenta.name }}</td>
                        <td>{{ cuenta.id }}</td>
                        <td>
                            <a href="{% url 'calendario:dashboard' cuenta.id %}" class="btn btn-primary btn-sm">


                                Ver Dashboard
                            </a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <div class="alert alert-warning">
            No se encontraron cuentas de Instagram conectadas.
        </div>
    {% endif %}
</div>

</body>
</html>
